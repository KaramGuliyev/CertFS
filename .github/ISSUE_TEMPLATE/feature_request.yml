name: Feature request
description: Suggest an idea for CertFS Quiz
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The study problem or situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it working (command, setting, button...).
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead?
